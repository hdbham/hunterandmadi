name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'google-apps-script-rsvp.gs'
      - 'gas/appsscript.json'
      - '.github/workflows/deploy-appsscript.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Authenticate clasp
        run: printf '%s' '${{ secrets.CLASPRC_JSON }}' > "$HOME/.clasprc.json"

      - name: Stage Apps Script source
        run: |
          cp google-apps-script-rsvp.gs gas/Code.gs
          printf '{"scriptId":"%s","rootDir":"gas"}' '${{ secrets.GAS_SCRIPT_ID }}' > .clasp.json

      - name: Push code to Apps Script
        run: clasp push -f

      - name: Deploy new web app version
        run: clasp deploy -i '${{ secrets.GAS_DEPLOYMENT_ID }}' -d "Auto-deploy ${{ github.sha }}"
